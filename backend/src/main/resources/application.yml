spring:
  application:
    name: korbgeld
  config:
    # Liest die .env aus dem Repo-Wurzelordner; "optional", damit Render ohne Datei startet
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Neon Free erlaubt wenige Verbindungen und trennt sie beim Einschlafen
      maximum-pool-size: 5
      max-lifetime: 300000
  jpa:
    open-in-view: false
    hibernate:
      # Das Schema gehört Flyway; Hibernate prüft nur, ob die Entities dazu passen
      ddl-auto: validate

app:
  name: Korbgeld
  cors:
    # Welche Frontend-Adressen das Backend aufrufen dürfen (leer = niemand)
    allowed-origins: ${FRONTEND_URL:}
  jwt:
    # Mindestens 32 Zeichen, sonst startet die App nicht (JwtConfig)
    secret: ${JWT_SECRET:}
    validity-hours: 12
  budget:
    # Obergrenze: 500 € pro Person im Haushalt (AUFTRAG.md, Abschnitt 7)
    max-per-person: 500
  demo:
    # Höchstens so viele neue Sandbox-Nutzer pro Tag, darüber 429
    max-per-day: 100
    # Sandbox-Nutzer, die älter sind, werden gelöscht
    retention-days: 7
  seed:
    enabled: true

server:
  # Render gibt den Port über PORT vor
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
