# Nur lokal aktiv (bootRun setzt das Profil "dev"), nicht auf Render
app:
  cors:
    # FRONTEND_URL und zusätzlich der Vite-Entwicklungsserver (AUFTRAG.md, Abschnitt 10)
    allowed-origins: ${FRONTEND_URL:http://localhost:5173},http://localhost:5173

logging:
  level:
    # Jedes SQL, das Hibernate an Postgres schickt
    org.hibernate.SQL: debug
    # Die Werte für die ?-Platzhalter im SQL
    org.hibernate.orm.jdbc.bind: trace
