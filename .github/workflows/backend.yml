name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Cacht Gradle und Abhängigkeiten zwischen den Läufen
      - uses: gradle/actions/setup-gradle@v6

      # Kompilieren und alle Tests; Docker ist auf dem Runner vorhanden, Testcontainers läuft mit
      - run: ./gradlew build
